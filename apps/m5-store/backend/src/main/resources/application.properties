spring.application.name=store

# 실행 환경에서 주입하는 DB 접속정보
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# SQL로 생성한 테이블과 Entity 매핑의 일치 여부 검사
# 테이블 자동 생성 및 변경 없이 불일치 시 실행 중단
spring.jpa.hibernate.ddl-auto=validate

# 서비스 트랜잭션 안에서 DB 조회 완료
spring.jpa.open-in-view=false

# 개발 환경에서만 활성화하는 SQL 출력
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# 로그인 세션 및 쿠키 설정
server.servlet.session.timeout=30m
server.servlet.session.cookie.name=STORE_SESSION
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}

# 게시판·OTT와 구분한 로컬 실행 포트
server.port=${SERVER_PORT:8082}