server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # API 요청은 ALB에서 백엔드로 전달
    location = /api {
        return 404;
    }
    location ^~ /api/ {
        return 404;
    }

    # 실제 파일이 없는 경우 React 화면 대신 404 응답
    location /assets/ {
        try_files $uri =404;
    }
    location /images/ {
        try_files $uri =404;
    }

    # React Router의 직접 접속 및 새로고침 지원
    location / {
        try_files $uri $uri/ /index.html;
    }
}
