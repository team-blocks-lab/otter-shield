name: Store 이미지 빌드 및 ECR 업로드

on:
  workflow_dispatch:

permissions: {}

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    permissions:
      contents: read
      id-token: write

    env:
      AWS_REGION: ca-central-1

    steps:
      - name: 저장소 체크아웃
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: AWS 역할 연결
        uses: aws-actions/configure-aws-credentials@00943011d9042930efac3dcd3a170e4273319bc8 # v5.1.0
        with:
          aws-region: ${{ env.AWS_REGION }}
          role-to-assume: ${{ vars.STORE_AWS_ROLE_ARN }}

      - name: Store 이미지 빌드
        run: |
          docker build --platform linux/amd64 -t otter-store-api:ci apps/m5-store/backend
          docker build --platform linux/amd64 -t otter-store-web:ci apps/m5-store/frontend

      - name: ECR 이미지 업로드
        shell: bash
        run: |
          account_id="$(aws sts get-caller-identity --query Account --output text)"
          registry="$account_id.dkr.ecr.$AWS_REGION.amazonaws.com"
          tag="$GITHUB_SHA-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"

          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "$registry"

          for image in otter-store-api otter-store-web; do
            uri="$registry/$image:$tag"
            docker tag "$image:ci" "$uri"
            docker push "$uri"
            printf -- '- `%s`\n' "$uri" >> "$GITHUB_STEP_SUMMARY"
          done
